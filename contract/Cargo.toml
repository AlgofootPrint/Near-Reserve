[package]
name = "agent-vault"
version = "0.1.0"
edition = "2021"
description = "Rob the Agent: a NEAR vault whose spending policy lives on-chain, out of reach of any prompt."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
